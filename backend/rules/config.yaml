# DISCLAIMER: All thresholds are configurable placeholders for the demo and must be reviewed by the
# clinical team before any real use. They are not clinical guidance.
#
# Every Flag records `rules_version` = hash of this file, so each flag can be traced to the exact
# configuration that produced it.

# R1_INTRA_SBP_DROP: pre_sbp - min_intra_sbp (or pre_sbp - post_sbp when min_intra_sbp is missing), mmHg
sbp_drop_threshold: 20

# R2_RECURRING_SYMPTOM: same symptom code in >= recurrence_min of the last recurrence_window sessions with approved facts
recurrence_min: 3
recurrence_window: 5

# R3_MISSING_REQUIRED: a session with no note this many hours after it ended is flagged
note_deadline_hours: 24

# R4_INTERDIALYTIC_GAIN: pre_weight_kg(current) - post_weight_kg(previous session), kg
gain_threshold_kg: 3.0

# R5_RECURRING_ACCESS_ISSUE: same access finding code in >= access_recurrence_min of the last access_recurrence_window sessions with approved facts
access_recurrence_min: 2
access_recurrence_window: 3

# R6_PENDING_REVIEW: extraction draft pending for more than this many hours
review_sla_hours: 24
