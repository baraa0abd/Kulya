[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations", ".venv"]

[tool.ruff.lint]
# C90: a function with more than ten branches is split. RUF100: no suppression that suppresses nothing.
select = ["E", "F", "I", "UP", "B", "C90", "RUF100"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "kulya.settings"
python_files = ["test_*.py"]
addopts = "-q --reuse-db"
