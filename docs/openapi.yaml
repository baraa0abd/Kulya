openapi: 3.0.3
info:
  title: Kulya API
  version: 0.1.0
  description: Dialysis documentation review and session summaries. Synthetic data
    only. Not a medical device.
paths:
  /api/admin/accounts/:
    get:
      operationId: admin_accounts_list
      description: Staff, patient and caregiver accounts of the administrator's own
        organization.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccountList'
          description: ''
    post:
      operationId: admin_accounts_create
      description: Staff, patient and caregiver accounts of the administrator's own
        organization.
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Account'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Account'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Account'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
  /api/admin/accounts/{id}/deactivate/:
    post:
      operationId: admin_accounts_deactivate_create
      description: Staff, patient and caregiver accounts of the administrator's own
        organization.
      parameters:
