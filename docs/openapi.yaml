  /api/assistant/chat/:
    get:
      operationId: assistant_chat_list
      description: |-
        The signed-in patient's own conversation. The patient comes from the account, never from the
        request, so one patient can neither ask about nor read another's record.
      tags:
      - assistant
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatMessage'
          description: ''
    post:
      operationId: assistant_chat_create
      description: |-
        The signed-in patient's own conversation. The patient comes from the account, never from the
        request, so one patient can neither ask about nor read another's record.
      tags:
      - assistant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Ask'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Ask'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Ask'
        required: true
      security:
      - jwtAuth: []
