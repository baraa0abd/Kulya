components:
  schemas:
    AIReview:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        session:
          type: string
          format: uuid
          readOnly: true
        trigger:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AIReviewStatusEnum'
          readOnly: true
        label:
          type: string
          readOnly: true
        rule_findings:
          readOnly: true
        protocol_passages:
          readOnly: true
        output:
          readOnly: true
          nullable: true
        ai_error:
          readOnly: true
        model_name:
          type: string
          readOnly: true
        prompt_version:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        reviewed_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - ai_error
      - created_at
      - id
      - label
      - model_name
      - output
      - prompt_version
      - protocol_passages
      - reviewed_at
      - reviewed_by
      - rule_findings
      - session
      - status
      - trigger
    AIReviewStatusEnum:
      enum:
      - processing
      - pending_review
      - ai_unavailable
      - reviewed
      type: string
      description: |-
        * `processing` - Processing
        * `pending_review` - Pending Review
        * `ai_unavailable` - Ai Unavailable
        * `reviewed` - Reviewed
    AISummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        session:
          type: string
          format: uuid
          readOnly: true
        version:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AISummaryStatusEnum'
          readOnly: true
        label:
          type: string
          readOnly: true
        metrics:
          readOnly: true
        output:
          readOnly: true
          nullable: true
        ai_error:
          readOnly: true
        model_name:
          type: string
          readOnly: true
        prompt_version:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        verified_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        verified_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        released:
          type: boolean
          readOnly: true
        released_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - ai_error
      - created_at
      - id
      - label
      - metrics
      - model_name
      - output
      - prompt_version
      - released
      - released_at
      - session
      - status
      - verified_at
      - verified_by
      - version
    AISummaryStatusEnum:
      enum:
      - processing
      - unverified
      - verified
      - rejected
      - ai_unavailable
      type: string
      description: |-
        * `processing` - Processing
        * `unverified` - Unverified
        * `verified` - Verified
        * `rejected` - Rejected
        * `ai_unavailable` - Ai Unavailable
    AccessTypeEnum:
      enum:
      - AVF
