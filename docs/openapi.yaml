        completeness checks.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this ai review.
        required: true
      tags:
      - ai
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
