openapi: 3.0.3
info:
  title: Kulya API
  version: 0.1.0
  description: Dialysis documentation review and session summaries. Synthetic data
    only. Not a medical device.
paths:
  /api/ai/reviews/:
    get:
      operationId: ai_reviews_list
      description: AI documentation reviews. Only doctors read them; nurses get the
        completeness checks.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - ai
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAIReviewList'
          description: ''
  /api/ai/reviews/{id}/:
    get:
      operationId: ai_reviews_retrieve
      description: AI documentation reviews. Only doctors read them; nurses get the
        completeness checks.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this ai review.
        required: true
      tags:
      - ai
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIReview'
          description: ''
  /api/ai/reviews/completeness/:
