name: kulya
# Kulya — local stack. Synthetic data only.
#   docker compose up -d db redis        -> infrastructure for local development and tests
#   docker compose up --build            -> full stack (db, redis, backend, worker, frontend)
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kulya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kulya-dev-only}
      POSTGRES_DB: kulya
    ports: ["127.0.0.1:5433:5432"]   # loopback only; never published publicly
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kulya -d kulya"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend: &backend
    build: ./backend
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://kulya:${POSTGRES_PASSWORD:-kulya-dev-only}@db:5432/kulya
      CELERY_BROKER_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
      CELERY_TASK_ALWAYS_EAGER: "false"
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    # Synthetic demo records are seeded only with DEMO_MODE=true (the default). With DEMO_MODE=false the
    # database starts empty apart from the food catalogue; see DEPLOYMENT.md, "Running with real records".
    command: >
      sh -c "python manage.py migrate --noinput &&
      python manage.py load_food_catalog &&
      if [ \"$${DEMO_MODE:-true}\" = \"true\" ]; then python manage.py seed_demo; fi &&
      gunicorn kulya.wsgi -b 0.0.0.0:8000 --workers 2"
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    <<: *backend
    command: celery -A kulya worker --loglevel=info --concurrency=2
    ports: []
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A kulya inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
        NEXT_PUBLIC_DEMO_MODE: ${DEMO_MODE:-true}
    depends_on:
      backend: {condition: service_healthy}
    ports: ["127.0.0.1:3000:3000"]

volumes:
  pgdata:
